<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Veterinaria</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background-color: #f4f6f9; }
        .admin-header { background-color: #d35400; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;}
        .admin-nav a { color: white; text-decoration: none; margin: 0 10px; font-weight: bold; }
        .admin-dashboard { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
        .admin-card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; margin-top: 5px; }
        .btn-admin { background-color: #2c3e50; color: white; padding: 8px 15px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header class="admin-header">
        <h2>Panel Admin - San Marcos</h2>
        <nav class="admin-nav">
            <a href="#">Servicios</a>
            <a href="#">Usuarios</a>
            <a href="index.html">Cerrar Sesión</a>
        </nav>
    </header>

    <main class="admin-dashboard">
        <!-- Mantenedor de Servicios -->
        <section class="admin-card">
            <h3>Mantenedor de Servicios</h3>
            <table>
                <tr>
                    <th>ID</th>
                    <th>Servicio</th>
                    <th>Precio</th>
                    <th>Acción</th>
                </tr>
                <tr>
                    <td>SV001</td>
                    <td>Consulta general</td>
                    <td>$15.000</td>
                    <td><button>Editar</button></td>
                </tr>
            </table>
            
            <h4>Agregar / Editar Servicio</h4>
            <form id="formAdminServicio">
                <div class="form-group">
                    <input type="text" placeholder="Nombre del servicio" required>
                </div>
                <div class="form-group">
                    <input type="number" placeholder="Precio" required>
                </div>
                <button type="submit" class="btn-admin">Guardar Servicio</button>
            </form>
        </section>

        <!-- Mantenedor de Usuarios -->
        <section class="admin-card">
            <h3>Gestión de Usuarios</h3>
            <table>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Acción</th>
                </tr>
                <tr>
                    <td>Admin Principal</td>
                    <td>admin@sanmarcos.cl</td>
                    <td>Administrador</td>
                    <td><button>Editar</button></td>
                </tr>
            </table>

            <h4>Agregar / Editar Usuario</h4>
            <form id="formAdminUsuario">
                <div class="form-group">
                    <input type="text" placeholder="Nombre completo" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Correo electrónico" required>
                </div>
                <div class="form-group">
                    <select required>
                        <option value="">Asignar Rol...</option>
                        <option value="admin">Administrador</option>
                        <option value="recepcionista">Recepcionista</option>
                        <option value="cliente">Dueño de mascota</option>
                    </select>
                </div>
                <button type="submit" class="btn-admin">Guardar Usuario</button>
            </form>
        </section>
    </main>
</body>
</html>
