<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="novedades.html">Blog</a>
            <a href="contacto.html">Contacto</a>
            <a href="servicios.html"class="btn-menu btn-azul">Servicios</a>
            <a href="login.html"class="btn-menu btn-naranja" >Iniciar Sesión</a>
        </nav>
    </header>

    <main style="max-width: 500px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <h2>Envíanos tu consulta</h2>
        <form id="formContacto" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            
            <label>Nombre (Máximo 100 caracteres):</label>
            <input type="text" id="contactoNombre" maxlength="100" required>
            
            <label>Correo Electrónico:</label>
            <input type="email" id="contactoCorreo" maxlength="100" required>
            
            <label>Comentario (Máximo 500 caracteres):</label>
            <textarea id="contactoMensaje" rows="5" maxlength="500" required></textarea>
            
            <button type="submit" style="padding: 10px; background-color: #2c3e50; color: white; border: none; cursor: pointer;">Enviar Mensaje</button>
            <p id="contacto-error" style="font-weight: bold; text-align: center;"></p>
        </form>
    </main>

    <footer style="text-align: center; margin-top: 40px; padding: 20px; background-color: #f1f1f1;">
        <p>&copy; 2024 Veterinaria San Marcos.</p>
    </footer>

    <script src="js/validaciones.js"></script>
</body>
</html>
