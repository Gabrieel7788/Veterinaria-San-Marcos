<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Veterinaria San Marcos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <img src="img/logo.png" alt="Logo Veterinaria San Marcos">
        <nav>
            <a href="index.html">Inicio</a>
            <a href="registro.html">Registro</a>
            <a href="servicios.html"class="btn-menu btn-azul">Servicios</a>
            <a href="login.html"class="btn-menu btn-naranja" >Iniciar Sesión</a>
        </nav>
    </header>

    <main>
        <section style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
            <h2>Registro de Usuario</h2>
            <form id="formRegistro" style="display: flex; flex-direction: column; gap: 10px;">
                
                <label>RUN (Sin puntos ni guion):</label>
                <input type="text" id="rut" required>
                
                <label>Nombre:</label>
                <input type="text" id="nombre" maxlength="50" required>
                
                <label>Apellidos:</label>
                <input type="text" id="apellidos" maxlength="100" required>
                
                <label>Correo Electrónico:</label>
                <input type="email" id="correo" maxlength="100" required>
                
                <label>Región:</label>
                <select id="region" required>
                    <option value="">Seleccione una región</option>
                </select>
                
                <label>Comuna:</label>
                <select id="comuna" required>
                    <option value="">Seleccione una comuna</option>
                </select>
                
                <label>Dirección:</label>
                <input type="text" id="direccion" maxlength="300" required>
                
                <button type="submit" style="padding: 10px; background-color: #2c3e50; color: white; border: none; cursor: pointer;">Registrarse</button>
                <p id="mensaje-error" style="color: red; font-weight: bold;"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Veterinaria San Marcos.</p>
    </footer>

    <!-- A validaciones -->
    <script src="js/validaciones.js"></script>
</body>
</html>
